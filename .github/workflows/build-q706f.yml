name: Build Q706F boot stage

# Consumes the toolchain published by build-toolchain.yml and builds the kernel,
# package, firmware and payload steps of a UniXNU device repository on Linux.
#
# The toolchain is fetched from a release, not rebuilt: scripts/linux/
# setup-toolchain.py compiles a patched clang plus cctools-port, mig, iig and
# lzfse, which is 1-2 hours per run and which UniXNU's own workflows cache
# per repository (actions/cache is isolated to one repository, expires after
# 7 days without access, and cannot be pinned to a version).
#
# The expected archive sha256 lives in toolchain.lock so a replaced release
# cannot silently change what gets executed. Regenerate it with:
#
#   scripts/fetch-toolchain.sh --print-lock

on:
  workflow_dispatch:
    inputs:
      toolchain_tag:
        description: 'Toolchain release tag (empty reads toolchain.lock)'
        default: ''
        required: false
      device_repository:
        description: 'UniXNU device repository'
        default: 'ilylty/UniXNU-q706f'
        required: true
      device_ref:
        description: 'Device repository ref'
        default: 'main'
        required: true
      unixnu_ref:
        description: 'UniXNU/UniXNU ref'
        default: 'main'
        required: true
      steps:
        description: 'Space-separated build steps'
        default: 'kernel package firmware payload'
        required: false

permissions:
  contents: read

concurrency:
  group: build-q706f-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.steps }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PREFIX: /opt/unixnu-linux
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.unixnu_ref }}
          path: UniXNU

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # setup-toolchain.py installs packages itself, but the toolchain archive
      # does not carry the host libraries the build then needs: libclang is
      # only required to build iig, yet libbsd, uuid and the Mach-O headers are
      # read at build time. This also matters on a cache hit, where the
      # installer never runs.
      - name: Install the host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ninja-build cmake flex bison \
            git patch python3 python3-dev xz-utils bzip2 cpio rsync \
            curl wget ca-certificates tcsh unifdef mtools \
            libssl-dev zlib1g-dev libbsd-dev uuid-dev \
            llvm-dev libclang-dev device-tree-compiler clang lld zstd

      - name: Install the toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOOLCHAIN_TAG: ${{ inputs.toolchain_tag }}
        run: bash scripts/fetch-toolchain.sh "$PREFIX"

      # scripts/unixnu/kernel.py::linux_env() checks /usr/bin/xcrun before it
      # builds. The tarball deliberately does not carry it: the three shims it
      # needs there are installed by setup-toolchain.py, which is idempotent and
      # skips every already-built component, so this finishes in seconds.
      - name: Install the /usr/bin shims
        run: |
          set -euo pipefail
          sudo env UNIXNU_TOOLCHAIN="$PREFIX" \
            python3 UniXNU/scripts/linux/setup-toolchain.py "$PREFIX" \
            --llvm-config "$(command -v llvm-config || echo /usr/bin/llvm-config)" \
            2>&1 | tail -20
          sudo chown -R "$(id -u):$(id -g)" "$PREFIX"
          for shim in xcrun plutil codesign; do
            test -x "/usr/bin/$shim" || { echo "::error::/usr/bin/$shim missing"; exit 1; }
          done

      - name: Verify the toolchain
        run: bash scripts/smoke-test.sh "$PREFIX"

      - name: Fetch the pinned sources
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x unixnu
          ./unixnu fetch -D ../device

      - name: Configure
        working-directory: UniXNU
        run: ./unixnu defconfig -D ../device

      - name: Assemble the build tree
        working-directory: UniXNU
        run: ./unixnu tree -D ../device

      - name: Report the resolved configuration
        working-directory: UniXNU
        run: |
          ./unixnu status --json -D ../device | tee "$RUNNER_TEMP/status.json"
          python3 - "$RUNNER_TEMP/status.json" <<'PY'
          import json, sys
          status = json.load(open(sys.argv[1]))
          for key in ('device', 'name', 'output', 'configured', 'profiles'):
              print(f'{key:12}:', status.get(key))
          board = status.get('board') or {}
          print('board       :', {k: board.get(k) for k in
                                  ('name', 'soc', 'soc_source', 'os_profile', 'kit')})
          PY

      - name: Build
        working-directory: UniXNU
        env:
          UNIXNU_TOOLCHAIN: /opt/unixnu-linux
          UNIXNU_DTB: ${{ github.workspace }}/device/dts/q706f.dtb
          # The archive builders replay xnu's per-object compile recipes and
          # read a .o.json record beside each object. Nothing on Linux writes
          # them unless XNU's $(CCACHE) hook points at the recorder that does.
          CCACHE: python3 ${{ github.workspace }}/device/scripts/compile-records.py
        run: |
          set -euo pipefail
          for step in ${{ inputs.steps }}; do
            echo "::group::unixnu build $step"
            ./unixnu build "$step" -D ../device 2>&1 | tee "$RUNNER_TEMP/build-$step.log"
            echo '::endgroup::'
          done

      - name: Package the usable artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts"
          # Everything the local bootimg step needs, plus the boot images any
          # step produced. `find -name` rather than a fixed path because the
          # output layout carries the OS profile and device name.
          for pattern in 'kernel.macho' 'kernel.macho.*' 'UniXNU.efi' \
                         'SILICIUM_UEFI.fd' 'payload.img' 'boot.img' 'boot.json'; do
            find UniXNU/out -name "$pattern" -type f \
              -exec cp -v {} "$RUNNER_TEMP/artifacts/" \;
          done
          ls -l "$RUNNER_TEMP/artifacts"
          ( cd "$RUNNER_TEMP/artifacts" && sha256sum * > SHA256SUMS )

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: q706f-boot-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/artifacts/
            ${{ runner.temp }}/status.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q706f-build-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/build-*.log
          if-no-files-found: ignore
          retention-days: 14
