name: Build Linux toolchain

# Publishes the UniXNU Linux host toolchain as a release asset.
#
# scripts/linux/setup-toolchain.py in UniXNU/UniXNU builds a patched clang
# (llvm-xnu-builtin-type.patch), cctools-port ld64/nm/lipo/libtool, mig, iig
# and lzfse. That is 1-2 hours of compute on a 4-core runner, so it is built
# once here and downloaded from a release by every consumer build.
#
# A release is better than actions/cache for this: cache entries expire after
# 7 days without access, are capped at 10 GB per repository, and cannot be
# pinned to a version. A release asset is permanent and addressable by tag.
#
# The tag is derived from the content of UniXNU/scripts/linux, so re-running
# with unchanged inputs reuses the existing release instead of rebuilding.

on:
  workflow_dispatch:
    inputs:
      unixnu_ref:
        description: 'UniXNU/UniXNU ref to build the toolchain from'
        default: 'main'
        required: true
      tag:
        description: 'Release tag override (empty derives it from scripts/linux content)'
        default: ''
        required: false
      force:
        description: 'Rebuild and replace the release even if the tag already exists'
        type: boolean
        default: false
  push:
    branches: [main]
    # Only the inputs that change the produced bytes. Editing README.md or the
    # device templates must not start a two-hour LLVM build: the tag is derived
    # from UniXNU/scripts/linux, the pinned refs, the host LLVM and the runner
    # release, none of which those files affect, so the run would find the
    # existing release and stop -- after paying for checkout and tool install.
    paths:
      - '.github/workflows/build-toolchain.yml'
      - 'scripts/toolchain-tag.py'
      - 'scripts/smoke-test.sh'

permissions:
  contents: write

concurrency:
  group: build-toolchain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the UniXNU Linux toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PREFIX: /opt/unixnu-linux
      UNIXNU_URL: https://github.com/UniXNU/UniXNU
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      built: ${{ steps.existing.outputs.built }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.unixnu_ref || 'main' }}
          path: UniXNU
          fetch-depth: 1

      # The llvm-project source tree plus its ninja build tree is the bulk of
      # this job: roughly 3-4 GB. The installed toolchain is small because
      # `ninja install-clang install-clang-resource-headers` ships the clang
      # driver and its headers only, not libclang's static libraries or the
      # rest of LLVM: UniXNU's own cache entries for it are around 53 MB
      # compressed. A hosted runner has enough free space, so only drop the
      # preinstalled SDKs that are never used.
      - name: Reclaim disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            || true
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /

      # setup-toolchain.py installs these itself, but doing it here keeps a
      # package failure separate from a build failure in the log.
      - name: Install the host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ninja-build cmake flex bison \
            git patch python3 python3-dev xz-utils bzip2 cpio rsync \
            curl wget ca-certificates tcsh unifdef mtools \
            libssl-dev zlib1g-dev libbsd-dev uuid-dev \
            llvm-dev libclang-dev device-tree-compiler clang lld zstd

      # Ubuntu keeps llvm-config under /usr/lib/llvm-<N>/bin and exposes only
      # the versioned name in /usr/bin. setup-toolchain.py resolves the host
      # LLVM through llvm-config, and sudo drops the environment, so pin it
      # and pass it explicitly.
      - name: Resolve the host LLVM
        run: |
          set -euo pipefail
          cfg="$(command -v llvm-config || true)"
          if [ -z "$cfg" ]; then
            cfg="$(ls -1 /usr/lib/llvm-*/bin/llvm-config 2>/dev/null | sort -V | tail -1)"
          fi
          [ -n "$cfg" ] || { echo '::error::no llvm-config found'; exit 1; }
          echo "llvm-config: $cfg ($("$cfg" --version))"
          echo "LLVM_CONFIG=$cfg" >> "$GITHUB_ENV"

      - name: Resolve the release tag
        id: tag
        env:
          LLVM_CONFIG: ${{ env.LLVM_CONFIG }}
        run: |
          set -euo pipefail
          python3 scripts/toolchain-tag.py \
            --unixnu UniXNU \
            --llvm-config "$LLVM_CONFIG" \
            --verbose \
            > "$RUNNER_TEMP/tag.txt"
          cat "$RUNNER_TEMP/tag.txt"
          tag="$(head -1 "$RUNNER_TEMP/tag.txt")"
          if [ -n "${{ inputs.tag }}" ]; then
            echo "::warning::using the tag override '${{ inputs.tag }}' instead of the derived '$tag'"
            tag="${{ inputs.tag }}"
          fi
          echo "release tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "unixnu_sha=$(git -C UniXNU rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "unixnu_short=$(git -C UniXNU rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check whether the release already exists
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.tag.outputs.tag }}" \
               -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release ${{ steps.tag.outputs.tag }} already exists"
            if [ "${{ inputs.force }}" = "true" ]; then
              echo "built=yes" >> "$GITHUB_OUTPUT"
            else
              echo "built=no" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "built=yes" >> "$GITHUB_OUTPUT"
          fi

      # setup-toolchain.py is idempotent: an already installed component is
      # skipped. It must run as root because it installs /usr/bin/{xcrun,
      # plutil,codesign}, which generate_shim() cannot place anywhere else and
      # scripts/unixnu/kernel.py requires at that exact path.
      #
      # The work directory holds the llvm-project tree, so it must be on disk:
      # the script's own default, /var/tmp, is fine here.
      - name: Build the toolchain
        if: steps.existing.outputs.built == 'yes'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/toolchain-build.log"
          : > "$log"
          sudo env \
            UNIXNU_TOOLCHAIN="$PREFIX" \
            LLVM_CONFIG="$LLVM_CONFIG" \
            TMPDIR=/var/tmp \
            python3 UniXNU/scripts/linux/setup-toolchain.py "$PREFIX" \
            --llvm-config "$LLVM_CONFIG" \
            -j "$(nproc)" >> "$log" 2>&1 &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            echo "--- $(date -u +%H:%M:%S) still building, $(du -sh "$PREFIX" 2>/dev/null | cut -f1) placed ---"
            tail -n 3 "$log" || true
            sleep 240
          done
          rc=0
          wait "$pid" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::setup-toolchain.py failed (exit $rc)"
            tail -n 300 "$log"
            exit "$rc"
          fi
          tail -n 20 "$log"
          sudo chown -R "$(id -u):$(id -g)" "$PREFIX"
          du -sh "$PREFIX"

      - name: Verify the toolchain
        if: steps.existing.outputs.built == 'yes'
        run: |
          set -euo pipefail
          bash scripts/smoke-test.sh "$PREFIX" 2>&1 | tee "$RUNNER_TEMP/smoke-test.log"

      # Order matters: this step writes BUILD-INFO.txt and reads the archive
      # digest from it, so it runs after Package.
      - name: Package the toolchain
        if: steps.existing.outputs.built == 'yes'
        run: |
          set -euo pipefail
          name="unixnu-linux-toolchain-${{ steps.tag.outputs.tag }}.tar.zst"
          # Root the archive at the prefix's basename so it can be unpacked
          # into any parent directory, not only /opt. -19: the tree is tens of
          # megabytes and saved once per input change, so spend the CPU on a
          # smaller asset.
          tar -C "$(dirname "$PREFIX")" -I 'zstd -T0 -19' -cf "$RUNNER_TEMP/$name" "$(basename "$PREFIX")"
          cd "$RUNNER_TEMP"
          sha256sum "$name" > "$name.sha256"
          ls -lh "$name" "$name.sha256"
          echo "ARCHIVE=$name" >> "$GITHUB_ENV"

      - name: Write the build manifest
        if: steps.existing.outputs.built == 'yes'
        run: |
          set -euo pipefail
          {
            echo "# UniXNU Linux toolchain build manifest"
            echo
            echo "## Release"
            echo "tag:               ${{ steps.tag.outputs.tag }}"
            echo "format:            tar.zst rooted at the prefix basename"
            echo "built_at:          $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "built_by:          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "prefix:            $PREFIX"
            echo
            echo "## UniXNU source"
            echo "repository:        $UNIXNU_URL"
            echo "ref:               ${{ inputs.unixnu_ref || 'main' }}"
            echo "commit:            ${{ steps.tag.outputs.unixnu_sha }}"
            echo
            echo "## Pinned upstream refs (from scripts/linux/setup-toolchain.py)"
            echo "llvm_commit:       ${{ steps.tag.outputs.llvm_commit }}"
            echo "cctools_port_ref:  ${{ steps.tag.outputs.cctools_port_ref }}"
            echo "libdispatch_ref:   ${{ steps.tag.outputs.libdispatch_ref }}"
            echo "bootstrap_cmds:    ${{ steps.tag.outputs.bootstrap_cmds_tag }}"
            echo "iig_port_commit:   ${{ steps.tag.outputs.iig_port_commit }}"
            echo "lzfse_commit:      ${{ steps.tag.outputs.lzfse_commit }}"
            echo
            echo "## Host"
            echo "runner:            ubuntu-24.04 ($(lsb_release -ds 2>/dev/null || echo unknown))"
            echo "glibc:             $(ldd --version | head -1)"
            echo "host_llvm:         ${{ steps.tag.outputs.host_llvm }}"
            echo "python:            $(python3 --version)"
            echo "gcc:               $(gcc --version | head -1)"
            echo "cmake:             $(cmake --version | head -1)"
            echo "ninja:             $(ninja --version)"
            echo
            echo "## Produced"
            echo "built_clang:       $("$PREFIX/llvm/bin/clang" --version | head -1)"
            echo "ld:                $("$PREFIX/CommandLineTools/usr/bin/ld" -v 2>&1 | head -1)"
            echo "prefix_size:       $(du -sh "$PREFIX" | cut -f1)"
            echo "archive_sha256:    $(cut -d' ' -f1 "$RUNNER_TEMP/$ARCHIVE.sha256")"
            echo "archive_size:      $(stat -c%s "$RUNNER_TEMP/$ARCHIVE") bytes"
          } | tee "$RUNNER_TEMP/BUILD-INFO.txt"

      - name: Publish the release
        if: steps.existing.outputs.built == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "replacing the existing release $tag"
            gh release delete "$tag" -R "${{ github.repository }}" --yes --cleanup-tag
          fi
          gh release create "$tag" -R "${{ github.repository }}" \
            --title "UniXNU Linux toolchain $tag" \
            --notes-file "$RUNNER_TEMP/BUILD-INFO.txt" \
            "$RUNNER_TEMP/$ARCHIVE" \
            "$RUNNER_TEMP/$ARCHIVE.sha256" \
            "$RUNNER_TEMP/BUILD-INFO.txt"
          gh release view "$tag" -R "${{ github.repository }}"

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-build-${{ steps.tag.outputs.tag }}
          path: |
            ${{ runner.temp }}/toolchain-build.log
            ${{ runner.temp }}/smoke-test.log
            ${{ runner.temp }}/BUILD-INFO.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarise
        if: always()
        run: |
          {
            echo "## UniXNU Linux toolchain"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| tag | \`${{ steps.tag.outputs.tag }}\` |"
            echo "| UniXNU commit | \`${{ steps.tag.outputs.unixnu_short }}\` |"
            echo "| scripts/linux digest | \`${{ steps.tag.outputs.scripts_hash }}\` |"
            echo "| host LLVM | ${{ steps.tag.outputs.host_llvm }} |"
            echo "| built | ${{ steps.existing.outputs.built }} |"
            echo "| prefix | \`$PREFIX\` |"
            if [ -f "$RUNNER_TEMP/BUILD-INFO.txt" ]; then
              echo
              echo '```'
              cat "$RUNNER_TEMP/BUILD-INFO.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
